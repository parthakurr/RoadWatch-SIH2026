<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="RoadWatch — AI-Powered Municipal Road Damage Detection & Governance Dashboard" />
    <title>RoadEye — Municipal AI Road Governance Platform</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Tailwind Play CDN for immediate runtime styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: {
                800: '#0F172A',
                900: '#0B0F19',
              }
            }
          }
        }
      }
    </script>

    <style>
      /* Ensure full viewport height and dark background by default */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0F172A; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }

      /* Marker pulse animation */
      @keyframes markerPulse {
        0% { box-shadow: 0 0 4px currentColor; }
        50% { box-shadow: 0 0 16px currentColor; }
        100% { box-shadow: 0 0 4px currentColor; }
      }
      .custom-pin > div {
        animation: markerPulse 2.5s ease-in-out infinite;
      }

      /* Slide-up animation for mobile detail panel */
      @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .slide-up {
        animation: slideUp 0.3s ease-out;
      }

      /* Fade-in animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      /* Login background gradient animation */
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animated-gradient {
        background: linear-gradient(-45deg, #0F172A, #1E293B, #0F172A, #1a1a2e);
        background-size: 400% 400%;
        animation: gradientShift 8s ease infinite;
      }

      /* Button hover glow */
      .btn-glow:hover {
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      }

      tbody tr {
        transition: background-color 0.15s ease;
      }

      .leaflet-container {
        width: 100%;
        height: 100%;
        min-height: 400px;
        background-color: #0b0f19 !important;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
